  <text x="72" y="385" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d0d1d2">Record the issue, get a clear reference,</text>
  <text x="72" y="416" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#d0d1d2">and keep the details ready for follow-up.</text>
