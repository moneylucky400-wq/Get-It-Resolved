  <text x="730" y="161" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="-.7" fill="#171b19">1,142 company listings</text>
  <text x="730" y="190" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#626a65">Search brands and keep your case organised.</text>
