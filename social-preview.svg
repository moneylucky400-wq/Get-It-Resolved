<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">GetItResolved customer service case tracking</title>
  <desc id="desc">Document your customer service issue, get a clear case reference, and follow up in one place.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#09110e"/><stop offset="1" stop-color="#10251d"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174d38"/><stop offset="1" stop-color="#102c21"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1000" cy="20" r="355" fill="url(#orb)" opacity=".72"/>
  <circle cx="1110" cy="440" r="250" fill="#143426" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="54" width="48" height="48" rx="14" fill="#116449"/>
    <path d="M92 64l12 5v9c0 9-5 14-12 18-7-4-12-9-12-18v-9z" fill="none" stroke="#a7ffc5" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="m86 79 4 4 8-9" fill="none" stroke="#a7ffc5" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="86" fill="#f4f7f5" font-size="29" font-weight="700">GetIt<tspan fill="#a7ffc5">Resolved</tspan></text>
    <text x="72" y="165" fill="#a7ffc5" font-size="13" font-weight="700" letter-spacing="3.2">CUSTOMER SERVICE, MADE CLEARER</text>
    <text x="68" y="248" fill="#f4f7f5" font-size="59" font-weight="700" letter-spacing="-2">Your complaint,</text>
    <text x="68" y="320" fill="#a7ffc5" font-size="59" font-weight="700" letter-spacing="-2">clearly documented.</text>
    <text x="72" y="383" fill="#c3ccc7" font-size="21">Record the issue, get a clear reference,</text>
    <text x="72" y="415" fill="#c3ccc7" font-size="21">and keep the details ready for follow-up.</text>
    <rect x="70" y="466" width="490" height="55" rx="17" fill="#12271e" stroke="#1b6044"/>
    <circle cx="96" cy="493" r="5" fill="#a7ffc5"/>
    <text x="115" y="499" fill="#e5eee9" font-size="16" font-weight="700">Record it</text>
    <path d="M199 493h31" stroke="#486357" stroke-width="2"/>
    <text x="248" y="499" fill="#e5eee9" font-size="16" font-weight="700">Get a reference</text>
    <path d="M381 493h30" stroke="#486357" stroke-width="2"/>
    <text x="430" y="499" fill="#e5eee9" font-size="16" font-weight="700">Follow up</text>
    <text x="72" y="578" fill="#a7ffc5" font-size="15" font-weight="700">getitresolved.org</text>
  </g>
  <g filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect x="680" y="65" width="450" height="500" rx="29" fill="#f8faf8"/>
    <text x="722" y="112" fill="#167453" font-size="12" font-weight="700" letter-spacing="2.2">YOUR CUSTOMER SERVICE CASE</text>
    <text x="722" y="151" fill="#1b2520" font-size="25" font-weight="700">One clear place to follow up</text>
    <text x="722" y="180" fill="#69736d" font-size="15">Keep every detail organised, from start to finish.</text>
    <rect x="722" y="207" width="366" height="88" rx="16" fill="#edf5ef"/>
    <circle cx="758" cy="251" r="20" fill="#d5f2df"/>
    <path d="M749 252a9 9 0 0 1 18 0v7h-4v-7a5 5 0 0 0-10 0v7h-4z" fill="none" stroke="#14724f" stroke-width="2.3"/>
    <rect x="746" y="253" width="5" height="10" rx="2" fill="#14724f"/><rect x="765" y="253" width="5" height="10" rx="2" fill="#14724f"/>
    <text x="793" y="244" fill="#25302a" font-size="16" font-weight="700">We&apos;re here to help</text>
    <text x="793" y="267" fill="#68736c" font-size="13">Your issue, clearly recorded.</text>
    <text x="722" y="334" fill="#27332c" font-size="14" font-weight="700">CASE PROGRESS</text>
    <path d="M744 371v105" stroke="#c9d9ce" stroke-width="2"/>
    <circle cx="744" cy="371" r="11" fill="#16825b"/><path d="m739 371 4 4 7-8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="772" y="367" fill="#26312b" font-size="15" font-weight="700">Issue documented</text>
    <text x="772" y="388" fill="#7a847e" font-size="13">Your details are saved together</text>
    <circle cx="744" cy="429" r="11" fill="#d8eee0"/><circle cx="744" cy="429" r="4" fill="#16825b"/>
    <text x="772" y="425" fill="#26312b" font-size="15" font-weight="700">Reference ready</text>
    <text x="772" y="446" fill="#7a847e" font-size="13">Easy to quote when you follow up</text>
    <circle cx="744" cy="487" r="11" fill="#e8ece9"/>
    <text x="772" y="483" fill="#26312b" font-size="15" font-weight="700">Follow-up made simple</text>
    <text x="772" y="504" fill="#7a847e" font-size="13">Keep your case details close</text>
    <path d="M722 529h366" stroke="#e3e9e5"/>
    <text x="722" y="550" fill="#14724f" font-size="12" font-weight="700">CLEAR. ORGANISED. READY WHEN YOU NEED IT.</text>
  </g>
</svg>
